[package]
name = "wrum_app"
version = "0.1.0"
edition = "2024"

[dependencies]
raylib = { version = "6.0.0", features = ["SUPPORT_IMAGE_GENERATION"] }
anyhow.workspace = true
libm.workspace = true
wrum_net = { path = "../net" }
wrum_core = { path = "../core" }
wrum_proto = { path = "../proto" }
rand = "0.10.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"

[features]
debug-renderer = ["wrum_core/debug-renderer"]
