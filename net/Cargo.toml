[package]
name = "wrum_net"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quinn = "0.11.12"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "CloseEvent",
    "BinaryType",
    "console",
]}
