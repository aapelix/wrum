name: server image
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  image:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - name: Build and push
        env:
          USER: ${{ secrets.REGISTRY_USER }}
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
            IMG=codeberg.org/aaro/wrum_server
            echo "$TOKEN" | docker login codeberg.org -u "$USER" --password-stdin
            docker build -t $IMG:latest -t $IMG:${{ github.sha }} . -f server.Dockerfile
            docker push $IMG:latest
            docker push $IMG:${{ github.sha }}
