[workspace]
members = ["app", "core", "net", "proto", "server"]
resolver = "3"

[workspace.dependencies]
glam = { version = "0.34.1", default-features = false, features = ["float-types", "std", "rkyv-08", "bytecheck"]}
rkyv = { version = "0.8.18", default-features = false, features = ["std", "bytecheck", "unaligned"]}
anyhow = "1.0.104"
futures-channel = "0.3.34"
futures-util = "0.3.34"
libm = "0.2.16"
wtransport = "0.7.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
