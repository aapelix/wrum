[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[dependencies]
rkyv = { version = "0.8.18", default-features = false, features = ["std", "bytecheck", "unaligned"]}
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"], optional = true }

[features]
small-ptr = ["rkyv/pointer_width_16"]
ws-server = ["dep:tungstenite"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
